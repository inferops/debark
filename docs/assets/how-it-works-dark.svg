<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">Prepare online. Install offline.</title>
  <desc id="desc">Three steps. First, choose the target: capture a snapshot of the offline machine, or choose a baseline OS. Second, build online: resolve dependencies and download the packages your target needs. Copy the bundle to the offline machine by USB or other media. Third, verify and install on the offline target, from the bundle's local apt repository.</desc>
  <!-- Website palette. Keep geometry and text in sync with the light variant. -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1 1.5 L5.5 4.5 L1 7.5" fill="none" stroke="#e8a33d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="880" height="220" rx="16" fill="#1c1710"/>

  <!-- step cards -->
  <g fill="#221b13" stroke="#362c20">
    <rect x="20" y="28" width="242" height="148" rx="12"/>
    <rect x="318" y="28" width="242" height="148" rx="12"/>
    <rect x="616" y="28" width="242" height="148" rx="12"/>
  </g>

  <!-- step numbers -->
  <g fill="#2e2213" stroke="#e8a33d">
    <circle cx="238" cy="52" r="14"/>
    <circle cx="536" cy="52" r="14"/>
    <circle cx="834" cy="52" r="14"/>
  </g>

  <!-- command pills -->
  <g fill="#2e2213">
    <rect x="40" y="138" width="190" height="26" rx="7"/>
    <rect x="338" y="138" width="118" height="26" rx="7"/>
    <rect x="636" y="138" width="198" height="26" rx="7"/>
  </g>

  <!-- flow between the steps -->
  <g fill="none" stroke="#e8a33d" stroke-width="2" marker-end="url(#arrow)">
    <path d="M274 102 H304"/>
    <path d="M572 102 H602"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g fill="#e8a33d" font-size="15" font-weight="700" text-anchor="middle">
      <text x="238" y="57">1</text>
      <text x="536" y="57">2</text>
      <text x="834" y="57">3</text>
    </g>

    <g fill="#f7f1e6" font-size="18" font-weight="600">
      <text x="40" y="58">Choose the target</text>
      <text x="338" y="58">Build online</text>
      <text x="636" y="58">Verify and install</text>
    </g>

    <g fill="#a3947f" font-size="14">
      <text x="40" y="86">Capture a snapshot of the</text>
      <text x="40" y="105">offline machine, or choose</text>
      <text x="40" y="124">a baseline OS.</text>

      <text x="338" y="86">Resolve dependencies and</text>
      <text x="338" y="105">download the packages your</text>
      <text x="338" y="124">target needs.</text>

      <text x="636" y="86">Check the bundle, then</text>
      <text x="636" y="105">install from its local apt</text>
      <text x="636" y="124">repository.</text>
    </g>

    <!-- where each step runs -->
    <g fill="#a3947f" font-size="11.5" letter-spacing="0.08em">
      <text x="20" y="198">OFFLINE TARGET OR BUILDER</text>
      <text x="318" y="198">ONLINE BUILDER</text>
      <text x="616" y="198">OFFLINE TARGET</text>
    </g>

    <!-- the transfer across the air gap -->
    <g fill="#e8a33d" font-size="11" font-weight="600" text-anchor="middle">
      <text x="587" y="126">copy</text>
      <text x="587" y="140">by USB</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e8a33d">
    <text x="52" y="156">debark snapshot create</text>
    <text x="350" y="156">debark build</text>
    <text x="648" y="156">debark verify → install</text>
  </g>
</svg>
