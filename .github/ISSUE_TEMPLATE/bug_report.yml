name: Bug report
description: Report a problem with the CLI, engine, desktop app, or documentation.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing. Report vulnerabilities privately through
        [SECURITY.md](https://github.com/inferops/debark/blob/main/SECURITY.md).

        Review logs and fixtures before posting. Snapshots, bundle metadata, and URLs
        can contain sensitive information; `--redact` is not a complete anonymizer.
        Never attach a private signing key.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - CLI or engine
        - Desktop app
        - Documentation
        - Packaging or release
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the actual result and any error message or exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands or UI steps and the smallest package list or synthetic fixture that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: Output of debark version --json, or the source revision. For the desktop app, also include the version from About. For docs-only reports, identify the page.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Where did the problem occur?
      options:
        - Online builder (build or baseline synthesis)
        - Offline target (snapshot capture, verification, or installation)
        - Both or not applicable
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Environment
      description: Builder OS/architecture, target release/architecture, snapshot or baseline ID, backend, and container runtime if applicable. Use N/A for documentation issues.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Include only the output needed to understand the problem; remove sensitive details.
      render: shell
