<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 446" role="img" aria-labelledby="title desc">
  <title id="title">Prepare online. Install offline.</title>
  <desc id="desc">Choose a snapshot of the offline target or a baseline OS. Build a bundle on the online machine, copy it by USB or other media, then verify and install on the offline target.</desc>
  <!-- Website palette; keep geometry and text in sync with the dark variant. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#965c14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="560" height="446" rx="16" fill="#fbf7f0"/>
  <g fill="#fffdf9" stroke="#e4dacb">
    <rect x="20" y="20" width="520" height="102" rx="12"/>
    <rect x="20" y="154" width="520" height="102" rx="12"/>
    <rect x="20" y="324" width="520" height="102" rx="12"/>
  </g>
  <g fill="none" stroke="#965c14" stroke-width="2" marker-end="url(#arrow)">
    <path d="M48 123 V146"/>
    <path d="M48 257 V316"/>
  </g>
  <g fill="#f5e6cd" stroke="#965c14">
    <circle cx="48" cy="54" r="16"/>
    <circle cx="48" cy="188" r="16"/>
    <circle cx="48" cy="358" r="16"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g fill="#965c14" font-size="18" font-weight="700" text-anchor="middle">
      <text x="48" y="60">1</text>
      <text x="48" y="194">2</text>
      <text x="48" y="364">3</text>
    </g>
    <g fill="#241c12" font-size="23" font-weight="600">
      <text x="80" y="60">Choose your target</text>
      <text x="80" y="194">Build online</text>
      <text x="80" y="364">Verify and install offline</text>
    </g>
    <g fill="#6b5c48" font-size="18">
      <text x="80" y="88">Capture a snapshot of the offline machine</text>
      <text x="80" y="110">or choose a baseline OS.</text>
      <text x="80" y="222">Resolve dependencies, download packages,</text>
      <text x="80" y="244">and optionally sign the bundle.</text>
      <text x="80" y="392">Check the bundle, then install from</text>
      <text x="80" y="414">its local apt repository.</text>
    </g>
    <text x="80" y="293" fill="#965c14" font-size="18" font-weight="600">Copy the bundle by USB or other media</text>
  </g>
</svg>
