name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vulnerabilities-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum
      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned govulncheck
        run: |
          set -euo pipefail
          # Git Bash is available on Windows runners; Make is not guaranteed.
          version="$(sed -n 's/^GOVULNCHECK_VERSION[[:space:]]*:=[[:space:]]*\([^[:space:]]*\).*/\1/p' Makefile)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go install "golang.org/x/vuln/cmd/govulncheck@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan the CLI and engine
        run: govulncheck ./...
      - name: Scan the desktop application
        working-directory: gui
        run: govulncheck -tags desktop,production,webkit2_41 ./...
