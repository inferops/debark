name: Feature request
description: Suggest an improvement to debark.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests and review the
        [project scope](https://github.com/inferops/debark/blob/main/GOVERNANCE.md).
        debark focuses on Debian/Ubuntu package transfers through its CLI and
        optional desktop app. Describe the task you need to complete so we can
        discuss an approach that fits.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should debark do? A command example or UI description can help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing flags, other tools, or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Constraints, target platforms, or related issues.
